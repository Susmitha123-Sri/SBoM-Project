<!DOCTYPE html>
<html>
<head>
    <title>SBOM Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    <style>
    body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: #0f172a;
    }

    .app {
        display: flex;
        align-items: flex-start;
    }

    /* ========================= */
    /* SIDEBAR (LIGHT THEME) */
    /* ========================= */
    /* Sticky (in the flex flow) instead of styles.css's position: fixed, so
       the page content always starts to the right of it and can never slide
       underneath it. */
    .sidebar {
        position: sticky;
        top: 0;
        flex: 0 0 240px;
        width: 240px;
        height: 100vh;
        overflow-y: auto;
        box-sizing: border-box;
        background: #ffffff;
        padding: 20px;
        box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    }

    /* TITLE */
    .sidebar h2 {
        margin-bottom: 30px;
        color: #1e293b;
        font-size: 20px;
        font-weight: 700;
    }

    /* LINKS */
    .sidebar a {
        display: block;
        padding: 10px 12px;
        margin-bottom: 8px;
        text-decoration: none;
        color: #475569;
        border-radius: 8px;
        transition: 0.3s;
        font-size: 14px;
    }

    /* HOVER */
    .sidebar a:hover {
        background: #eef2ff;
        color: #4f46e5;
    }

    /* ACTIVE */
    .sidebar a.active {
        background: #6366f1;
        color: white;
    }

    /* ========================= */
    /* MAIN CONTENT */
    /* ========================= */
    /* min-width: 0 lets wide tables scroll inside their own container
       instead of stretching .main (and the whole page) sideways.
       margin-left / width undo styles.css, which assumed a fixed sidebar. */
    .main {
        flex: 1 1 auto;
        min-width: 0;
        margin-left: 0;
        width: auto;
        padding: 0;
    }

    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <div class="sidebar">

        <h2>🚀 SBOM System</h2>

        <a href="/dashboard">📊 Dashboard</a>
        <a href="/repos">📦 Repositories</a>
        <a href="/monitor">🔍 Monitor</a>
        <a href="/packages">📁 Packages</a>
        <a href="/analytics">📈 Analytics</a>
        <a href="/trends">📅 Trends</a>

        <!-- ✅ UPDATED -->
        <a href="/run-scan">🚀 Run Scan</a>
        <a href="/settings">⚙️ Settings</a>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        {% block content %}{% endblock %}
    </div>

</div>

</body>
</html>
