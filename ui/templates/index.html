{% extends "layout.html" %}
{% block content %}

<style>
.container {
    padding: 30px;
}

/* CARD */
.card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* INPUT */
.input-box {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    margin-bottom: 10px;
}

/* BUTTON */
.btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.btn:hover {
    transform: scale(1.05);
}

/* TABLE */
.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

/* TREE */
.tree {
    margin-top: 20px;
    padding: 15px;
    background: #f9fafb;
    border-radius: 12px;
    border: 1px solid #ddd;
    max-height: 400px;
    overflow: auto;
}

.tree ul {
    list-style-type: none;
    padding-left: 20px;
}

.tree li {
    margin: 6px 0;
    font-size: 14px;
}

.tree li::before {
    content: "├─ ";
    color: #6366f1;
}

.tree li:last-child::before {
    content: "└─ ";
}

/* HIDDEN */
.hidden {
    display: none;
}
</style>

<div class="container">

    <!-- RUN SCAN -->
    <div class="card">
        <h2>🚀 Run Repository Scan</h2>

        <form id="scan-form">

            <input 
                type="text" 
                id="target-input" 
                class="input-box"
                placeholder="Enter GitHub repository URL"
                required
            >

            <label>
                <input type="checkbox" id="use-cache"> Use Cache
            </label>

            <br>

            <label>
                <input type="checkbox" id="shallow-clone"> Shallow Clone
            </label>

            <br><br>

            <button id="scan-button" class="btn" type="submit">
                Run Scan
            </button>

        </form>

        <div id="status" style="margin-top:10px;"></div>

        <!-- LOADING -->
        <div id="loading" style="display:none; margin-top:10px;">
            ⏳ Running scan... please wait
        </div>
    </div>

    <!-- RESULT SECTION -->
    <section id="result-section" class="card hidden">
        <h2>Scan Results</h2>

        <div id="summary"></div>

        <div class="table-wrapper">
          <table id="vulnerability-table">
            <thead>
              <tr>
                <th>Package</th>
                <th>Version</th>
                <th>Type</th>
                <th>Vulnerability</th>
                <th>Severity</th>
                <th>Fixed Version</th>
                <th>Latest Version</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- DEPENDENCY TREE -->
        <h3 style="margin-top:20px;">Dependency Tree</h3>
        <div id="dependency-tree" class="tree"></div>

        <div id="reports-links"></div>
    </section>

</div>

<!-- IMPORTANT: YOUR MAIN JS -->
<script src="{{ url_for('static', filename='app.js') }}"></script>

{% endblock %}
